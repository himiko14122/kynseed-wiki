name = "kynseed-wiki"
main = "_worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./out"
binding = "ASSETS"

# Custom domains (kynseed.wiki + www.kynseed.wiki) were bound via
# Cloudflare Workers Domains API (OAuth). wrangler 4.106 does not
# support a [[domains]] top-level field, so the binding is managed through the API.
